services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cocos
      POSTGRES_PASSWORD: cocos
      POSTGRES_DB: cocos
    ports:
      - "5432:5432"
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://cocos:cocos@postgres:5432/neondb
      PORT: 3000
    depends_on:
      - postgres
